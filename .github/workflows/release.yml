# Store release trigger (PLAN.md decisions 3, 12). A pushed `vX.Y.Z` tag waits for the
# `production` GitHub Environment reviewer, then starts the EAS `Release` workflow
# (.eas/workflows/release.yml), which builds, gates on the fingerprint and submits. The gate is
# here, not on EAS, because GitHub Environments only apply to Actions jobs; the EAS workflow is
# therefore `workflow_dispatch`-only. The tag is cut by a human until D1 (#60):
#   git tag v1.2.3 && git push origin v1.2.3
# Runbook: docs/release-ladder.md → Store release (tag).
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  trigger:
    name: Trigger EAS release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Required reviewer (scripts/repo-settings.js). Nothing runs on EAS until approved.
    environment: production
    steps:
      - name: Require EXPO_TOKEN
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::EXPO_TOKEN is not set as a repository secret — add an EAS robot token (docs/environments-and-secrets.md → Human setup checklist) and re-run."
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Start EAS release workflow
        # Uploads this checkout (the tagged tree) rather than `--ref`, which needs the Expo GitHub
        # App linked to the repo. Inputs not passed use the repo constants in the EAS file.
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          bun run eas workflow:run .eas/workflows/release.yml -F "tag=$TAG" --non-interactive
          echo "EAS Release started for $TAG — follow it on expo.dev → project → Workflows."

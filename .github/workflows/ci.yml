# JS gate (PLAN.md decision 1). Everything that needs no simulator runs here;
# the native lane lives in EAS Workflows. Later E2 tickets add sibling jobs
# (reassure). PR titles are checked in pr-title.yml.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CI: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: bun run lint

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: bun run typecheck

  format:
    name: Format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: bun run format:check

  knip:
    name: Knip
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: bun run knip

  env-check:
    name: Env check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: bun run env:check

  i18n-check:
    name: i18n check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: bun run i18n:check

  commitlint:
    # Lints every commit in the range (PR: base..head; push: before..sha) with the
    # same commitlint.config.js the local commit-msg hook uses.
    name: Commitlint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - name: Lint PR commits
        if: github.event_name == 'pull_request'
        run: bunx commitlint --from "$BASE_SHA" --to "$HEAD_SHA" --verbose
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      - name: Lint pushed commits
        if: github.event_name == 'push'
        # `before` is all zeros on a branch's first push (no range to lint); lint just HEAD then.
        run: |
          if [ "$BEFORE_SHA" = "0000000000000000000000000000000000000000" ]; then
            bunx commitlint --last --verbose
          else
            bunx commitlint --from "$BEFORE_SHA" --to "$HEAD_SHA" --verbose
          fi
        env:
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}

  secret-scan:
    # gitleaks over the commit range (PR: base..head; push: before..sha) with .gitleaks.toml.
    # No GITLEAKS_LICENSE: the action only needs one for organization-owned repos. Local
    # parity: `bun run secrets:scan`. PR comments are off to keep permissions read-only.
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
          GITLEAKS_ENABLE_SUMMARY: true
          GITLEAKS_ENABLE_COMMENTS: false

  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      # jest.config.js adds the jest-junit reporter (junit/jest.xml) when CI is set.
      - run: bun run test:coverage
      - name: Upload JUnit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit
          path: junit/
          if-no-files-found: warn
          retention-days: 14
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: |
            coverage/lcov.info
            coverage/lcov-report/
          if-no-files-found: warn
          retention-days: 14

  bundle-budget:
    # JS-only `expo export` per platform (no native toolchain; PLAN.md decisions 7, 10) plus a
    # gzip budget check against bundle-budget.json. The web export is also uploaded as
    # `web-export` for the Maestro web job to reuse.
    name: Bundle budget (${{ matrix.platform }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        platform: [web, ios, android]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: bun run export:${{ matrix.platform }}
      - run: bun run budget:${{ matrix.platform }}
      - name: Upload bundle sizes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bundle-sizes-${{ matrix.platform }}
          path: dist-${{ matrix.platform }}/bundle-sizes.json
          if-no-files-found: warn
          retention-days: 14
      - name: Upload web export
        if: matrix.platform == 'web'
        uses: actions/upload-artifact@v4
        with:
          name: web-export
          path: dist-web/
          retention-days: 7

  maestro-web:
    # Maestro web flows (`.maestro/flows`, tag `web`) against the static export from the
    # bundle-budget web entry (PLAN.md decisions 6, 10). `needs` on a matrix job waits for every
    # platform entry; only the web artifact is used. Maestro drives its own Chromium; JDK 17+ is
    # preinstalled on ubuntu-latest. Pinned MAESTRO_VERSION: 2.3.0 reads a 1px viewport on
    # Chrome 150+, fixed in 2.9.0.
    name: Maestro web
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: bundle-budget
    env:
      MAESTRO_CLI_NO_ANALYTICS: 1
      MAESTRO_VERSION: 2.10.0
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@v4
        with:
          name: web-export
          path: dist-web
      - name: Install Maestro
        run: |
          java -version
          curl -Ls "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
      - name: Serve web export
        run: |
          nohup bun run serve:web > maestro-web-serve.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf -o /dev/null http://localhost:8081/ && exit 0
            sleep 1
          done
          echo "serve-web did not come up on :8081" >&2
          exit 1
      - run: bun run e2e:web
      - name: Upload Maestro report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maestro-web
          path: maestro-web/
          if-no-files-found: warn
          retention-days: 14

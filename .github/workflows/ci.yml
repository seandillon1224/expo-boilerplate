# JS gate (PLAN.md decision 1). Everything that needs no simulator runs here;
# the native lane lives in EAS Workflows. PR titles are checked in pr-title.yml.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # PR-only. On a PR, a new push makes the run in flight pointless, so cancel it. On `main` every
  # push is a distinct commit that must carry its own green status — back-to-back merges (the
  # queue ledger commits land in bursts) would otherwise cancel the earlier commit's run and
  # leave it permanently "cancelled", which reads as a broken commit and breaks bisecting on
  # check status.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CI: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/setup
      - run: bun run lint

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/setup
      - run: bun run typecheck

  format:
    name: Format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/setup
      - run: bun run format:check

  knip:
    name: Knip
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/setup
      - run: bun run knip

  env-check:
    name: Env check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/setup
      - run: bun run env:check

  i18n-check:
    name: i18n check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/setup
      - run: bun run i18n:check

  commitlint:
    # Lints every commit in the range (PR: base..head; push: before..sha) with the
    # same commitlint.config.js the local commit-msg hook uses.
    name: Commitlint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - name: Lint PR commits
        if: github.event_name == 'pull_request'
        run: bunx commitlint --from "$BASE_SHA" --to "$HEAD_SHA" --verbose
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      - name: Lint pushed commits
        if: github.event_name == 'push'
        # `before` is all zeros on a branch's first push (no range to lint); lint just HEAD then.
        run: |
          if [ "$BEFORE_SHA" = "0000000000000000000000000000000000000000" ]; then
            bunx commitlint --last --verbose
          else
            bunx commitlint --from "$BEFORE_SHA" --to "$HEAD_SHA" --verbose
          fi
        env:
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}

  secret-scan:
    # gitleaks over the commit range (PR: base..head; push: before..sha) with .gitleaks.toml.
    # No GITLEAKS_LICENSE: the action only needs one for organization-owned repos. Local
    # parity: `bun run secrets:scan`. PR comments are off to keep permissions read-only.
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
          GITLEAKS_ENABLE_SUMMARY: true
          GITLEAKS_ENABLE_COMMENTS: false

  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/setup
      # jest.config.js adds the jest-junit reporter (junit/jest.xml) when CI is set.
      - run: bun run test:coverage
      - name: Upload JUnit report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: junit
          path: junit/
          if-no-files-found: warn
          retention-days: 14
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage
          path: |
            coverage/lcov.info
            coverage/lcov-report/
          if-no-files-found: warn
          retention-days: 14

  bundle-budget-web:
    # The web leg of the bundle budget, split out of the matrix below so `maestro-web` can
    # `needs:` this one job: `needs` on a matrix job waits for every entry, which made the web
    # E2E wait on the (unrelated) iOS and Android exports. The check name is unchanged —
    # "Bundle budget (web)", exactly what the matrix produced — so branch protection and
    # `REQUIRED_CHECKS` in scripts/repo-settings.js stay as they are.
    # JS-only `expo export` (no native toolchain; PLAN.md decisions 7, 10) plus a gzip budget
    # check against bundle-budget.json. The export is also uploaded as `web-export` for the
    # Maestro web job to reuse.
    # `export:web:e2e`, not `export:web`: `EXPO_PUBLIC_*` is inlined at export time, so the only
    # way the reused export can talk to the offline fixture API (`/fixtures/posts`, served by
    # scripts/serve-web.js — T13.2) is to bake the URL in here. The two exports differ by one
    # inlined URL string, which is noise against the gzip budget this job checks.
    name: Bundle budget (web)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/setup
      - run: bun run export:web:e2e
      - run: bun run budget --platform web
      - name: Upload bundle sizes
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: bundle-sizes-web
          path: dist-web/bundle-sizes.json
          if-no-files-found: warn
          retention-days: 14
      - name: Upload web export
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: web-export
          path: dist-web/
          retention-days: 7

  bundle-budget:
    # The native legs, same shape as the web job above and nothing depends on them. Keep the job
    # `name:` as "Bundle budget (<platform>)": the T10.6 guard test expands this matrix and
    # compares the result against REQUIRED_CHECKS.
    name: Bundle budget (${{ matrix.platform }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        platform: [ios, android]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/setup
      - run: bun run export:${{ matrix.platform }}
      - run: bun run budget --platform ${{ matrix.platform }}
      - name: Upload bundle sizes
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: bundle-sizes-${{ matrix.platform }}
          path: dist-${{ matrix.platform }}/bundle-sizes.json
          if-no-files-found: warn
          retention-days: 14

  maestro-web:
    # Maestro web entries (`.maestro/flows/web`, tag `web`) against the static export from the
    # `bundle-budget-web` job (PLAN.md decisions 6, 10) — that job exists separately from the
    # ios/android matrix precisely so this `needs` waits on the web export only, not on all
    # three legs. Maestro drives its own Chromium; JDK 17+ is
    # preinstalled on ubuntu-latest. The version below is pinned and kept in lockstep with
    # `.eas/workflows/*.yml` and `EXPECTED.maestroPinned` in `scripts/doctor.js` by the Maestro
    # custom manager in `.github/renovate.json5`; Maestro 2.3.0 read a 1px viewport on Chrome
    # 150+, fixed in 2.9.0.
    name: Maestro web
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: bundle-budget-web
    env:
      MAESTRO_CLI_NO_ANALYTICS: 1
      MAESTRO_VERSION: 2.10.0
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: web-export
          path: dist-web
      # `curl | bash` from get.maestro.mobile.dev would run whatever that endpoint serves today and
      # ignore MAESTRO_VERSION. Download the pinned release archive instead, check it against the
      # `checksums_sha256.txt` published alongside it, and cache the unpacked CLI on the version.
      - name: Cache Maestro
        id: maestro-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.maestro
          key: maestro-${{ runner.os }}-${{ env.MAESTRO_VERSION }}
      - name: Install Maestro
        if: steps.maestro-cache.outputs.cache-hit != 'true'
        run: |
          base="https://github.com/mobile-dev-inc/Maestro/releases/download/cli-$MAESTRO_VERSION"
          curl -fsSL -o maestro.zip "$base/maestro.zip"
          curl -fsSL -o maestro-checksums.txt "$base/checksums_sha256.txt"
          grep ' maestro\.zip$' maestro-checksums.txt | sha256sum --check --strict -
          rm -rf "$HOME/.maestro" "$RUNNER_TEMP/maestro-unpack"
          unzip -q maestro.zip -d "$RUNNER_TEMP/maestro-unpack"
          mv "$RUNNER_TEMP/maestro-unpack/maestro" "$HOME/.maestro"
          rm -rf maestro.zip maestro-checksums.txt "$RUNNER_TEMP/maestro-unpack"
      - name: Put Maestro on PATH
        run: |
          java -version
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
          "$HOME/.maestro/bin/maestro" --version
      - name: Serve web export
        run: |
          nohup bun run serve:web > maestro-web-serve.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf -o /dev/null http://localhost:8081/ && break
            sleep 1
          done
          if ! curl -sf -o /dev/null http://localhost:8081/; then
            echo "serve-web did not come up on :8081" >&2
            exit 1
          fi
          # The fetch flow reads posts from the offline fixture API (T13.2), not jsonplaceholder:
          # fail here, with a clear message, rather than as a red assertion inside Maestro.
          if ! curl -sf http://localhost:8081/fixtures/posts | head -c 200; then
            echo "serve-web is not serving .maestro/fixtures/posts.json" >&2
            exit 1
          fi
      - run: bun run e2e:web
      - name: Upload Maestro report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: maestro-web
          path: maestro-web/
          if-no-files-found: warn
          retention-days: 14

  perf:
    # Reassure render-duration compare (PLAN.md decision 7): measure the PR base commit as the
    # baseline, then the PR merge commit, on the same runner so both share its noise, and fail
    # via scripts/reassure-gate.js on any statistically significant slowdown. PR-only: a push
    # to main has no base to compare against. Report goes to the step summary and the
    # `reassure` artifact; no Danger / PR comment, so permissions stay read-only.
    name: Perf (Reassure)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - name: Measure baseline (PR base)
        # The base may predate `perf:baseline` (skip: compare then runs without a baseline and
        # the gate passes) or have no perf tests yet (--passWithNoTests: compare reports "added").
        run: |
          git switch --detach "$BASE_SHA"
          bun install --frozen-lockfile
          if node -e "process.exit(require('./package.json').scripts['perf:baseline'] ? 0 : 1)"; then
            bun run perf:baseline --branch "$BASE_REF" --commit-hash "$BASE_SHA" -- --passWithNoTests
          else
            echo "::notice::perf:baseline script not present on $BASE_REF; no baseline to compare against"
          fi
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
      - name: Measure current (PR head)
        run: |
          git switch --detach "$HEAD_SHA"
          bun install --frozen-lockfile
          bun run perf --branch "$HEAD_REF" --commit-hash "$HEAD_SHA"
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          HEAD_SHA: ${{ github.sha }}
      - name: Gate on significant regressions
        run: bun run perf:gate
      - name: Publish report to step summary
        if: always()
        run: |
          if [ -f .reassure/output.md ]; then
            cat .reassure/output.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No Reassure comparison report (missing baseline or measurement failed)." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload Reassure results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: reassure
          path: .reassure/
          if-no-files-found: warn
          retention-days: 14

  fingerprint-drift:
    # Native fingerprint drift (PLAN.md decisions 2, 13). Computes the production-variant
    # `@expo/fingerprint` hash — the runtime version, and what release.yml keys store builds on —
    # for the PR base and for the merge commit, with the repo-pinned package: no Metro, no EAS
    # credits, no EXPO_TOKEN. On drift it upserts ONE PR comment (marker `<!-- fingerprint-drift -->`)
    # and adds the `fingerprint-drift` label; a later push that removes the drift flips the same
    # comment to "resolved" and drops the label. Informational: never red on drift, not in
    # REQUIRED_CHECKS (docs/js-gate.md). PR-only: a push to main has no base to compare against.
    # Fork PRs get a read-only token, so the comment/label steps are skipped there (summary only).
    name: Fingerprint drift
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    env:
      # Store releases (and the promote.yml production gate) key on the production profile.
      APP_VARIANT: production
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/setup
      - name: Fingerprint PR head (merge commit)
        id: head
        run: echo "json=$(node scripts/fingerprint.js)" >> "$GITHUB_OUTPUT"
      - name: Fingerprint PR base
        id: base
        # Autolinked native modules under node_modules are fingerprint sources, so the base gets
        # its own install (same pattern as the Perf job).
        run: |
          git fetch --depth=1 origin "$BASE_SHA"
          git switch --detach "$BASE_SHA"
          bun install --frozen-lockfile
          echo "json=$(node scripts/fingerprint.js)" >> "$GITHUB_OUTPUT"
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
      - name: Compare, comment, label
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        env:
          HEAD_JSON: ${{ steps.head.outputs.json }}
          BASE_JSON: ${{ steps.base.outputs.json }}
          IS_FORK: ${{ github.event.pull_request.head.repo.full_name != github.repository }}
        with:
          script: |
            const MARKER = '<!-- fingerprint-drift -->';
            const LABEL = 'fingerprint-drift';
            const head = JSON.parse(process.env.HEAD_JSON);
            const base = JSON.parse(process.env.BASE_JSON);
            const baseRef = context.payload.pull_request.base.ref;
            const sha7 = context.sha.slice(0, 7);
            const short = (h) => '`' + h.slice(0, 12) + '`';
            const platforms = [['ios', 'iOS'], ['android', 'Android']];
            const changed = platforms.filter(([p]) => head[p] !== base[p]);
            const table = [
              `| Platform | \`${baseRef}\` | This PR |`,
              '| --- | --- | --- |',
              ...platforms.map(([p, label]) =>
                `| ${label} | ${short(base[p])} | ${short(head[p])} ${head[p] === base[p] ? '' : '**(changed)**'} |`,
              ),
            ].join('\n');

            const drift = changed.length > 0;
            const which = changed.map(([, label]) => label).join(' and ');
            core.summary.addHeading(drift ? `Native fingerprint drift: ${which}` : 'Native fingerprint unchanged', 3);
            core.summary.addRaw(table + '\n');
            await core.summary.write();
            if (drift) core.notice(`Native fingerprint changed on ${which}: merging needs a store release (vX.Y.Z tag) before production promotion.`);

            if (process.env.IS_FORK === 'true') {
              core.info('Fork PR: read-only token, skipping comment and label.');
              return;
            }

            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number, per_page: 100 });
            const existing = comments.find((c) => c.body && c.body.includes(MARKER));

            if (!drift && !existing) return; // clean PR: no comment at all

            const body = drift
              ? [
                  MARKER,
                  `## ⚠️ Native fingerprint drift (${which}) · \`${sha7}\``,
                  '',
                  `This PR changes the native fingerprint (\`@expo/fingerprint\`, \`APP_VARIANT=production\`) — the runtime version that EAS Update and store builds are keyed on. **This needs a store release.**`,
                  '',
                  table,
                  '',
                  `- **On merge:** \`deploy-staging.yml\` misses its build cache and cuts new staging builds (paid; iOS only with \`IOS_BUILDS\`). Installed staging apps must be reinstalled — the OTA cannot reach them.`,
                  `- **Promotion to production** (\`promote.yml\`) will be **refused** until a store build carries this fingerprint (PLAN.md decision 13).`,
                  `- **Store release required:** merge the open release-please PR (\`chore(main): release x.y.z\`), which tags \`vX.Y.Z\` → \`.github/workflows/release.yml\` → \`.eas/workflows/release.yml\` (TestFlight / Play internal), then promote the staging group again. Need a specific version? Land a commit with a \`Release-As: x.y.z\` footer.`,
                  `- Not intended? \`APP_VARIANT=production bun run fingerprint --debug\` on both branches lists every source that fed the hash.`,
                  '',
                  `_Informational — this check never blocks merge. Updated in place on every push; see docs/release-ladder.md → Fingerprint drift on PRs._`,
                ].join('\n')
              : [
                  MARKER,
                  `## ✅ Native fingerprint drift resolved · \`${sha7}\``,
                  '',
                  `A later push brought both platforms back to \`${baseRef}\`'s fingerprint; merging is a JS-only change again (OTA reaches installed builds, no store release needed).`,
                  '',
                  table,
                ].join('\n');

            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

            try {
              if (drift) {
                await github.rest.issues.addLabels({ owner, repo, issue_number, labels: [LABEL] });
              } else {
                await github.rest.issues.removeLabel({ owner, repo, issue_number, name: LABEL }).catch((e) => { if (e.status !== 404) throw e; });
              }
            } catch (e) {
              core.warning(`Could not update the "${LABEL}" label: ${e.message} (create it with: gh label create ${LABEL})`);
            }

  docs:
    # VitePress build of docs/ (T8.4, #143). This is the link audit: a dead relative link in any
    # doc fails the build (`ignoreDeadLinks: false` in docs/.vitepress/config.mts). The site
    # itself is published by docs.yml on push to main; this job only proves it builds.
    name: Docs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/setup
      - run: bun run docs:build

  template-init:
    # Template end-to-end test (PLAN.md decision 4; #56): scripts/template-e2e.js copies the
    # checkout to a temp dir, runs the documented headless `bun run init --fresh-git` there with no
    # EAS project id and no EXPO_TOKEN, then runs the JS gate (lint, typecheck, test, knip,
    # i18n:check, format:check, env:check, docs:build) on the generated project's first commit and scans it for
    # leftover template identifiers. The checkout itself must come out untouched. Local parity:
    # `bun run template:e2e`. Removed by `bun run init` (it only makes sense on the template).
    name: Template init
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/setup
      - run: bun run template:e2e
        env:
          EXPO_TOKEN: ''

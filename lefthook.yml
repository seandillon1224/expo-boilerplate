# https://lefthook.dev — installed via the `prepare` script on `bun install`.
# Fast, changed-files-only checks locally; the full gate runs in CI.
pre-commit:
  # Sequential, not parallel: eslint and prettier both rewrite the same files and re-stage them,
  # so running them at once can lose one tool's fix. `piped` also stops at the first failure,
  # which puts the cheap oxlint pass in front of the expensive fixers (ADR-0004).
  piped: true
  jobs:
    - name: oxlint
      glob: '*.{js,cjs,mjs,ts,mts,tsx}'
      run: bunx oxlint {staged_files}
    - name: eslint
      glob: '*.{js,cjs,mjs,ts,mts,tsx}'
      run: bunx eslint --fix {staged_files}
      stage_fixed: true
    - name: prettier
      glob: '*.{js,cjs,mjs,ts,mts,tsx,json,jsonc,md,yml,yaml,css}'
      run: bunx prettier --write {staged_files}
      stage_fixed: true

commit-msg:
  jobs:
    - name: commitlint
      run: bunx commitlint --edit {1}

pre-push:
  jobs:
    - name: typecheck
      run: bun run typecheck
    # The slowest job here; skip a single push with `LEFTHOOK_EXCLUDE=knip git push` (CI runs it).
    - name: knip
      run: bun run knip
    - name: i18n-check
      run: bun run i18n:check

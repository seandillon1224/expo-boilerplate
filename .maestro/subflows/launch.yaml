# Native launch, first step of every flows/<name>.yaml entry. Fresh state on each flow so
# ordering never matters; permissions granted up front so no system dialog blocks a step.
appId: ${MAESTRO_APP_ID}
---
- launchApp:
    clearState: true
    permissions:
      all: allow
# The demo session gate (T13.6): a cleared app opens on sign-in, so every flow taps through it
# here and still starts on Home. Delete this line with the session demo.
- runFlow: sign-in.yaml

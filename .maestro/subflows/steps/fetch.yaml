# Fetch: Home -> /fetch, wait for loading to finish, refetch button visible.
# The data comes from jsonplaceholder (external), so the flow does not assert list content
# and leaves the `fetch-retry` error path untested.
appId: ${APP_ID}
---
- assertVisible:
    id: home-screen
- tapOn:
    id: home-fetch-link
- assertVisible:
    id: fetch-screen
- extendedWaitUntil:
    notVisible:
      id: fetch-loading
    timeout: 20000
- assertVisible:
    id: fetch-refetch

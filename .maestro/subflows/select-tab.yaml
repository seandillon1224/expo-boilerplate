# Tap a tab-bar item. Env: TAB = route group name without parentheses (home | settings),
# TAB_LABEL = the visible label (Android only, see below).
#
# This is the one place a flow may select by something other than a testID:
#   iOS      NativeTabs.Trigger `testID` becomes the UITabBarItem accessibilityIdentifier
#            (`tab-<name>` in src/app/(tabs)/_layout.tsx), so `id:` works.
#   Android  the same `testID` is only the item's view tag, which Espresso-based drivers read but
#            Maestro does not. The only selectable string is `accessibilityLabel` (the item's
#            contentDescription), which defaults to the visible label and is what TalkBack
#            announces — so match the label rather than make screen readers read "tab-settings".
#            That makes the tap language-sensitive, so the Android lane pins the device locale
#            (scripts/e2e-pin-locale.js); docs/native-e2e.md → Device locale.
#   web      NativeTabs renders Radix tabs: <button role="tab" id="radix-<uid>-trigger-(<name>)-<nanoid>">
#            with no testID hook, so match the generated id by regex.
appId: ${MAESTRO_APP_ID}
---
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn:
          id: tab-${TAB}
- runFlow:
    when:
      platform: Android
    commands:
      - tapOn:
          text: ${TAB_LABEL}
- runFlow:
    when:
      platform: Web
    commands:
      - tapOn:
          id: ".*-trigger-\\(${TAB}\\)-.*"

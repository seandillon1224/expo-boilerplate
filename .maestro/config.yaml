# Maestro workspace (PLAN.md decision 6: Maestro for E2E on iOS, Android, and web).
#
# Run it as a workspace — `maestro test .maestro …` — so this file is read (Maestro only loads
# config.yaml from the directory it is given, and its default discovery is non-recursive).
#
# Layout — one set of steps per feature, thin entry files per platform:
#   flows/<name>.yaml        native entry: `appId: ${MAESTRO_APP_ID}`, `tags: [ios, android]`
#   flows/web/<name>.yaml    web entry:    `url: ${APP_URL}`,  `tags: [web]`
#   subflows/launch.yaml     native launchApp (clearState, permissions allowed)
#   subflows/launch-web.yaml web launchApp (opens the entry's `url`)
#   subflows/select-tab.yaml the only per-platform selector (tab bar; see below)
#   subflows/steps/<name>.yaml  the shared steps every entry runs after launching
#   Only `flows/*` and `flows/web/*` are flows; subflows are never discovered on their own.
#
# Why two entry files: Maestro picks the Chromium driver from a `url:` header alone (`url` beats
# `appId`, `--platform` does not override it), so a file with `url:` can never run natively.
# Each entry is therefore just header + two runFlow lines; the steps live once in subflows/.
#
# Tags (`--include-tags` picks entries, never subflows):
#   web            flows/web/*   — CI `maestro-web` job / `bun run e2e:web`
#   ios, android   flows/*       — EAS `e2e` workflow (T4.2) / `bun run e2e:ios|android`
#   quarantine     flaky flows, excluded from every gate with --exclude-tags quarantine
#                  (e2e.yml, `bun run e2e:web`, `bun run e2e:ios|android`). Rules:
#                    - add it to the entry file only (keep the platform tags), directly under a
#                      `# quarantine: #<issue>` comment pointing at the `flaky-flow` issue
#                    - max age 2 weeks: fix and drop the tag, or delete the flow
#                    - never delete assertions to make a flow pass
#                  Run them: `bun run e2e:ios|android --include-quarantine`, `bun run e2e:web`
#                  with the tags swapped by hand, or .eas/workflows/e2e-quarantine.yml.
#                  Full policy: docs/native-e2e.md → Flake budget.
#
# Selectors: testID only (CLAUDE.md) — `id:` is accessibilityIdentifier on iOS, resource-id on
# Android, DOM id on web. One exception, kept inside subflows/select-tab.yaml: NativeTabs renders
# the platform tab bar, whose items Maestro cannot address by id on Android (the trigger `testID`
# becomes a view tag there) or on web (Radix generates `…-trigger-(route)-…` ids), so that
# subflow matches the tab by generated id on web and by its visible label on Android.
#
# Env (`maestro test -e KEY=value`):
#   APP_URL  web: where the static export is served; `bun run e2e:web` defaults it to
#            http://localhost:8081 (`bun run serve:web`).
#   MAESTRO_APP_ID  native: the variant's bundle id / package derived in app.config.ts (YAML cannot
#            read APP_VARIANT, so the caller passes it), e.g. com.seandillon.expoboilerplate.dev.
#            The MAESTRO_ prefix is what lets the EAS `maestro` job feed it as a plain env var
#            (Maestro exposes MAESTRO_* shell variables to flows); locally `-e` sets it directly.
#
# Run web locally:  bun run export:web && bun run serve:web &   then   bun run e2e:web
# Run native:       see docs/native-e2e.md (bun run e2e:ios | e2e:android)
flows:
  - 'flows/*'
  - 'flows/web/*'

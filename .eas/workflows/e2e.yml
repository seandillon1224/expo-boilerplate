# Native E2E lane (PLAN.md decisions 1, 2, 6, 14). Per platform: fingerprint → get_build (hit:
# repack this commit's JS into the cached base | miss: paid full build) → maestro, then one PR
# comment. iOS is the expensive lane and can be tiered down (IOS_MODE below). The full story —
# cache idiom, tiered-mode matrix, local twins, failure artifacts — is docs/native-e2e.md.
#
# Run by hand:  bun run eas workflow:run .eas/workflows/e2e.yml [-F ios_mode=always]
# Validate:     bun run eas workflow:validate .eas/workflows/e2e.yml   (file cap: 16 KiB)
# PR triggers need the Expo GitHub App linked to the repo (docs/native-e2e.md → Workflow).
name: E2E (native)

on:
  # Every PR into main (decision 14). Fork PRs never trigger EAS workflows (docs/js-gate.md).
  pull_request:
    branches: [main]
  # Adding this label re-runs the lane with iOS forced on, whatever IOS_MODE says.
  pull_request_labeled: [e2e:ios]
  # IOS_MODE 2/3 — post-merge run on main. `false` for always | label (the PR run already
  # covered it); set `true` for main-only, which needs a place where iOS runs.
  push:
    branches: [main]
    if: false
  workflow_dispatch:
    inputs:
      # IOS_MODE 3/3 — the dispatch-time override. Keep `default` equal to the repo constant.
      ios_mode:
        type: choice
        options: [always, main-only, label]
        default: always
        required: false
        description: always = iOS on every run; main-only = iOS only on push-to-main / dispatch; label = iOS only on PRs labelled `e2e:ios`. Android always runs.

concurrency:
  # A new push to the same branch cancels the run in flight.
  cancel_in_progress: true
  group: ${{ workflow.filename }}-${{ github.ref }}

jobs:
  fingerprint:
    name: Fingerprint
    type: fingerprint
    # Must match the E2E build profiles in eas.json exactly, or the hash never matches a build.
    environment: development
    env:
      APP_VARIANT: development

  # --- iOS ---------------------------------------------------------------------------------

  get_build_ios:
    name: Get build (ios)
    type: get-build
    needs: [fingerprint]
    # IOS_MODE 1/3 — the repo-level tier is the `|| 'always'` fallback (inputs are empty outside
    # workflow_dispatch). Skipping this job skips the whole iOS chain via `needs` / empty ids.
    # always: run. main-only: run unless this is a PR. Any mode: run when the PR carries the
    # `e2e:ios` label. Change both literals together, plus `push.if` and the input default.
    if: ${{ (inputs.ios_mode || 'always') == 'always' || ((inputs.ios_mode || 'always') == 'main-only' && github.event_name != 'pull_request') || contains(toJSON(github.event.pull_request.labels || ''), '"e2e:ios"') }}
    params:
      platform: ios
      profile: e2e-ios-sim
      simulator: true
      fingerprint_hash: ${{ needs.fingerprint.outputs.ios_fingerprint_hash }}
      # Two PRs racing on the same new fingerprint: the second waits for the first's build.
      wait_for_in_progress: true

  build_ios:
    name: Build (ios)
    type: build
    needs: [get_build_ios]
    if: ${{ !needs.get_build_ios.outputs.build_id }}
    params:
      platform: ios
      profile: e2e-ios-sim
      message: e2e base build for fingerprint ${{ needs.fingerprint.outputs.ios_fingerprint_hash }}

  repack_ios:
    name: Repack (ios)
    type: repack
    needs: [get_build_ios]
    if: ${{ needs.get_build_ios.outputs.build_id }}
    params:
      build_id: ${{ needs.get_build_ios.outputs.build_id }}
      # Spelled out because eas-cli 23's `workflow:validate` crashes on a repack without one.
      profile: e2e-ios-sim
      message: e2e repack of ${{ github.sha }}

  maestro_ios:
    name: Maestro (ios)
    type: maestro
    # `after`, not `needs`: exactly one of the two is skipped by design. The `if` keeps this job
    # from starting with an empty build id (the one that ran failed, or iOS is tiered off).
    after: [repack_ios, build_ios]
    if: ${{ needs.repack_ios.outputs.build_id || needs.build_ios.outputs.build_id }}
    environment: development
    env:
      # Flows read `${MAESTRO_APP_ID}`: the bundle id / package app.config.ts derives for
      # APP_VARIANT=development, spelled out (here and below) because a pre-packaged job cannot
      # run `expo config`. `bun run init` (T7.1) rewrites it with app.config.ts.
      MAESTRO_APP_ID: com.seandillon.expoboilerplate.dev
    params:
      build_id: ${{ needs.repack_ios.outputs.build_id || needs.build_ios.outputs.build_id }}
      # The workspace directory (config.yaml + include_tags), same invocation as `bun run e2e:ios`.
      flow_path: .maestro
      include_tags: [ios]
      # Pinned to the version the JS gate and the local scripts use.
      maestro_version: 2.10.0
      # 4 flows → 2 shards. Experimental on EAS; drop to 1 first if a run misbehaves.
      shards: 2
      # Re-run only the failed flows, up to twice (T4.6 turns this into a tracked flake budget).
      retries: 2
      retry_failed_only: true
      # Recordings + JUnit land in the "Maestro Test Results" artifact; these are the job's only
      # artifact inputs (T4.4) — device logs come from the hook below.
      record_screen: true
      output_format: junit
    hooks:
      # Device logs are the one failure artifact Maestro does not produce: the same collector
      # `bun run e2e:ios` uses (Node built-ins only — no node_modules here). `always()` so it runs
      # after a red step; the collector never exits non-zero, so it cannot fail the job.
      after_maestro_tests:
        - name: Collect simulator log
          if: ${{ always() }}
          run: node scripts/e2e-device-logs.js --platform ios --out device-logs
        - name: Upload device logs
          if: ${{ always() }}
          uses: eas/upload_artifact
          with:
            type: other
            name: Device logs (ios)
            path: device-logs

  # --- Android -----------------------------------------------------------------------------

  get_build_android:
    name: Get build (android)
    type: get-build
    needs: [fingerprint]
    params:
      platform: android
      profile: e2e-android-apk
      fingerprint_hash: ${{ needs.fingerprint.outputs.android_fingerprint_hash }}
      wait_for_in_progress: true

  build_android:
    name: Build (android)
    type: build
    needs: [get_build_android]
    if: ${{ !needs.get_build_android.outputs.build_id }}
    params:
      platform: android
      profile: e2e-android-apk
      message: e2e base build for fingerprint ${{ needs.fingerprint.outputs.android_fingerprint_hash }}

  repack_android:
    name: Repack (android)
    type: repack
    needs: [get_build_android]
    if: ${{ needs.get_build_android.outputs.build_id }}
    params:
      build_id: ${{ needs.get_build_android.outputs.build_id }}
      profile: e2e-android-apk
      message: e2e repack of ${{ github.sha }}

  maestro_android:
    name: Maestro (android)
    type: maestro
    after: [repack_android, build_android]
    if: ${{ needs.repack_android.outputs.build_id || needs.build_android.outputs.build_id }}
    environment: development
    # The emulator needs a nested-virtualization worker; `large` because record_screen is on.
    runs_on: linux-large-nested-virtualization
    env:
      MAESTRO_APP_ID: com.seandillon.expoboilerplate.dev
    params:
      build_id: ${{ needs.repack_android.outputs.build_id || needs.build_android.outputs.build_id }}
      flow_path: .maestro
      include_tags: [android]
      maestro_version: 2.10.0
      shards: 2
      retries: 2
      retry_failed_only: true
      record_screen: true
      output_format: junit
    hooks:
      # Same as maestro_ios: `adb logcat -d` of the emulator into its own artifact.
      after_maestro_tests:
        - name: Collect logcat
          if: ${{ always() }}
          run: node scripts/e2e-device-logs.js --platform android --out device-logs
        - name: Upload device logs
          if: ${{ always() }}
          uses: eas/upload_artifact
          with:
            type: other
            name: Device logs (android)
            path: device-logs

  # --- PR comment --------------------------------------------------------------------------

  comment:
    name: Comment on PR
    type: github-comment
    # `after`, not `needs`: the comment must post on failure too, and half of these jobs are
    # skipped by design. `after.<job>.status` is success | failure | skipped.
    after:
      - fingerprint
      - get_build_ios
      - build_ios
      - repack_ios
      - maestro_ios
      - get_build_android
      - build_android
      - repack_android
      - maestro_android
    # Dispatch / push runs have no PR; the job would fail, not skip, without this guard. The
    # second clause covers the labelled event whatever its `event_name`.
    if: ${{ github.event_name == 'pull_request' || github.event.pull_request.number }}
    params:
      # Fully custom markdown; every run adds a comment (no update-in-place). The expo.dev
      # account/slug prefix has no context — `bun run init` (T7.1) rewrites it.
      payload: |
        ## E2E (native) · `${{ substring(github.sha, 0, 7) }}`

        | Platform | Maestro | Build | Fingerprint |
        | --- | --- | --- | --- |
        | iOS (simulator) | ${{ after.maestro_ios.status == 'success' ? '✅ passed' : after.maestro_ios.status == 'failure' ? '❌ failed' : after.get_build_ios.status == 'skipped' ? '⏭️ skipped (ios_mode; label `e2e:ios` to force)' : '⏭️ skipped' }} ${{ after.maestro_ios.outputs.total_flows_count ? '(' + after.maestro_ios.outputs.successful_flows_count + '/' + after.maestro_ios.outputs.total_flows_count + ' flows)' : '' }} | ${{ after.get_build_ios.outputs.build_id ? 'cached base + repack' : 'fresh build' }} — ${{ (after.repack_ios.outputs.build_id || after.build_ios.outputs.build_id) ? '[' + substring(after.repack_ios.outputs.build_id || after.build_ios.outputs.build_id || '', 0, 8) + '](https://expo.dev/accounts/seandillon1224/projects/expo-boilerplate/builds/' + (after.repack_ios.outputs.build_id || after.build_ios.outputs.build_id) + ')' : 'none (' + (after.get_build_ios.outputs.build_id ? after.repack_ios.status : after.build_ios.status) + ')' }} | `${{ substring(after.fingerprint.outputs.ios_fingerprint_hash || '', 0, 12) }}` |
        | Android (APK) | ${{ after.maestro_android.status == 'success' ? '✅ passed' : after.maestro_android.status == 'failure' ? '❌ failed' : '⏭️ skipped' }} ${{ after.maestro_android.outputs.total_flows_count ? '(' + after.maestro_android.outputs.successful_flows_count + '/' + after.maestro_android.outputs.total_flows_count + ' flows)' : '' }} | ${{ after.get_build_android.outputs.build_id ? 'cached base + repack' : 'fresh build' }} — ${{ (after.repack_android.outputs.build_id || after.build_android.outputs.build_id) ? '[' + substring(after.repack_android.outputs.build_id || after.build_android.outputs.build_id || '', 0, 8) + '](https://expo.dev/accounts/seandillon1224/projects/expo-boilerplate/builds/' + (after.repack_android.outputs.build_id || after.build_android.outputs.build_id) + ')' : 'none (' + (after.get_build_android.outputs.build_id ? after.repack_android.status : after.build_android.status) + ')' }} | `${{ substring(after.fingerprint.outputs.android_fingerprint_hash || '', 0, 12) }}` |

        ${{ after.maestro_ios.outputs.failed_flows_count > 0 ? '- iOS failed flows: `' + after.maestro_ios.outputs.failed_flow_names_json + '`' : '' }}
        ${{ after.maestro_android.outputs.failed_flows_count > 0 ? '- Android failed flows: `' + after.maestro_android.outputs.failed_flow_names_json + '`' : '' }}

        - **Install**: the Android build page hosts the install link + QR code (internal distribution). The iOS build is a simulator `.app` with no QR code: download it from its page or `bun run e2e:build --platform ios --build-id <id>`.
        - **Recordings / JUnit / device logs**: [workflow run](${{ workflow.url }}) → artifacts → **Maestro Test Results** + **Device logs (ios | android)**. Triage: docs/native-e2e.md → Failure artifacts.
        - **Reproduce locally**: `bun run e2e:build --platform <p> && bun run e2e:repack --platform <p> && bun run e2e:<p>` (docs/native-e2e.md).

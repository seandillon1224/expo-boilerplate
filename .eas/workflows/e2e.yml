# Native E2E lane (PLAN.md decisions 1, 2, 6, 14): every PR runs the Maestro flows on a real iOS
# Simulator and Android Emulator build, without CI ever running Metro or a native build it can
# avoid. Per platform:
#
#   fingerprint ─┬─ get_build_ios ─────┬─ repack_ios     (hit: inject this commit's JS bundle)
#                │                     └─ build_ios      (miss: full EAS build, paid, ~15 min)
#                │                          └────────────── maestro_ios
#                └─ get_build_android ─┬─ repack_android
#                                      └─ build_android
#                                           └────────────── maestro_android
#                                                                 └── comment  (PR only, always)
#
# `get-build` looks for a finished build of the E2E profile (`e2e-ios-sim` / `e2e-android-apk`,
# eas.json) whose fingerprint equals this commit's. On a hit the base build is reused and
# `repack` (@expo/repack-app) swaps in a fresh JS bundle; on a miss `build` produces a new base
# for that fingerprint, which the next PR with the same native surface will then find. A fresh
# build already embeds this commit's JS, so it is not repacked — that is the idiom from Expo's
# "continuous deployment with fingerprint and repack" example, and `maestro` takes whichever id
# exists.
#
# `comment` (github-comment, PLAN.md decision 12) posts one comment per run on the PR: per-platform
# result, fingerprint, cached-or-fresh build with a link to its page (install QR for the Android
# APK), the run link for recordings + JUnit, and the local reproduce line. It runs after every
# other job whatever their status, and is skipped on `workflow_dispatch` (no PR to post to).
#
# Local twins of each job: docs/native-e2e.md (`bun run fingerprint | e2e:build | e2e:repack |
# e2e:ios | e2e:android`).
#
# Run it by hand:  bun run eas workflow:run .eas/workflows/e2e.yml
#                  (or expo.dev → project → Workflows → "E2E (native)" → Run)
# Validate:        bun run eas workflow:validate .eas/workflows/e2e.yml
# PR trigger needs the Expo GitHub App linked to the repo (docs/native-e2e.md → Workflow).
name: E2E (native)

on:
  # Every PR into main (PLAN.md decision 14). Pushes to main are covered by the staging OTA
  # workflow (E5), which does its own fingerprint → get-build → update. Fork PRs never trigger
  # EAS workflows (docs/js-gate.md); this template assumes same-repo branches.
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      # Placeholder for T4.5 (tiered mode). Only `full` exists today; the value is not read yet.
      tier:
        type: choice
        options: [full]
        default: full
        required: false
        description: Which flows to run. T4.5 adds cheaper tiers; `full` runs every native flow.

concurrency:
  # A new push to the same PR branch cancels the run in flight (a build can't be reused across
  # commits with different JS anyway). `group` is the placeholder EAS asks for until custom
  # groups ship.
  cancel_in_progress: true
  group: ${{ workflow.filename }}-${{ github.ref }}

jobs:
  fingerprint:
    name: Fingerprint
    type: fingerprint
    # Must match the E2E build profiles exactly or the hash never matches a stored build:
    # `environment: development` plus the inline APP_VARIANT the profiles set in eas.json
    # (app.config.ts derives the bundle id / package from it, and those feed the fingerprint).
    environment: development
    env:
      APP_VARIANT: development

  # --- iOS ---------------------------------------------------------------------------------

  get_build_ios:
    name: Get build (ios)
    type: get-build
    needs: [fingerprint]
    params:
      platform: ios
      profile: e2e-ios-sim
      simulator: true
      fingerprint_hash: ${{ needs.fingerprint.outputs.ios_fingerprint_hash }}
      # Two PRs with the same new fingerprint: the second waits for the first's build instead
      # of starting its own.
      wait_for_in_progress: true

  build_ios:
    name: Build (ios)
    type: build
    needs: [get_build_ios]
    if: ${{ !needs.get_build_ios.outputs.build_id }}
    params:
      platform: ios
      profile: e2e-ios-sim
      message: e2e base build for fingerprint ${{ needs.fingerprint.outputs.ios_fingerprint_hash }}

  repack_ios:
    name: Repack (ios)
    type: repack
    needs: [get_build_ios]
    if: ${{ needs.get_build_ios.outputs.build_id }}
    params:
      build_id: ${{ needs.get_build_ios.outputs.build_id }}
      # Same as the source build's profile (the default); spelled out because eas-cli 23's
      # `workflow:validate` crashes on a repack job without one.
      profile: e2e-ios-sim
      message: e2e repack of ${{ github.sha }}

  maestro_ios:
    name: Maestro (ios)
    type: maestro
    # `after`, not `needs`: exactly one of the two is skipped by design. The `if` keeps this job
    # from starting with an empty build id when the one that ran has failed.
    after: [repack_ios, build_ios]
    if: ${{ needs.repack_ios.outputs.build_id || needs.build_ios.outputs.build_id }}
    environment: development
    env:
      # Maestro reads `MAESTRO_*` shell variables as `${MAESTRO_…}` in flows; this is the bundle
      # id / package app.config.ts derives for APP_VARIANT=development. The pre-packaged job cannot
      # run `expo config`, so the value is spelled out here (and below) — `bun run init` (T7.1)
      # rewrites it together with the identifiers in app.config.ts.
      MAESTRO_APP_ID: com.seandillon.expoboilerplate.dev
    params:
      build_id: ${{ needs.repack_ios.outputs.build_id || needs.build_ios.outputs.build_id }}
      # The workspace directory, so .maestro/config.yaml is read and `include_tags` picks the
      # native entries (flows/*.yaml) — same invocation as `bun run e2e:ios`.
      flow_path: .maestro
      include_tags: [ios]
      # Pin to the version the JS gate and the local scripts use (docs/native-e2e.md).
      maestro_version: 2.10.0
      # 4 flows → 2 shards. Sharding is experimental on EAS; drop to 1 first if a run misbehaves.
      shards: 2
      # Re-run only the failed flows, up to twice (T4.6 turns this into a tracked flake budget).
      retries: 2
      retry_failed_only: true
      # Screen recordings + `junit` report land in the "Maestro Test Results" run artifact.
      record_screen: true
      output_format: junit

  # --- Android -----------------------------------------------------------------------------

  get_build_android:
    name: Get build (android)
    type: get-build
    needs: [fingerprint]
    params:
      platform: android
      profile: e2e-android-apk
      fingerprint_hash: ${{ needs.fingerprint.outputs.android_fingerprint_hash }}
      wait_for_in_progress: true

  build_android:
    name: Build (android)
    type: build
    needs: [get_build_android]
    if: ${{ !needs.get_build_android.outputs.build_id }}
    params:
      platform: android
      profile: e2e-android-apk
      message: e2e base build for fingerprint ${{ needs.fingerprint.outputs.android_fingerprint_hash }}

  repack_android:
    name: Repack (android)
    type: repack
    needs: [get_build_android]
    if: ${{ needs.get_build_android.outputs.build_id }}
    params:
      build_id: ${{ needs.get_build_android.outputs.build_id }}
      # Same as the source build's profile (the default); spelled out because eas-cli 23's
      # `workflow:validate` crashes on a repack job without one.
      profile: e2e-android-apk
      message: e2e repack of ${{ github.sha }}

  maestro_android:
    name: Maestro (android)
    type: maestro
    after: [repack_android, build_android]
    if: ${{ needs.repack_android.outputs.build_id || needs.build_android.outputs.build_id }}
    environment: development
    # The emulator needs a nested-virtualization worker; `large` because record_screen is on.
    runs_on: linux-large-nested-virtualization
    env:
      MAESTRO_APP_ID: com.seandillon.expoboilerplate.dev
    params:
      build_id: ${{ needs.repack_android.outputs.build_id || needs.build_android.outputs.build_id }}
      flow_path: .maestro
      include_tags: [android]
      maestro_version: 2.10.0
      shards: 2
      retries: 2
      retry_failed_only: true
      record_screen: true
      output_format: junit

  # --- PR comment --------------------------------------------------------------------------

  comment:
    name: Comment on PR
    type: github-comment
    # `after`, not `needs`: the comment must post on failure too, and half of these jobs are
    # skipped by design (build xor repack). `after.<job>.status` is success | failure | skipped.
    after:
      - fingerprint
      - get_build_ios
      - build_ios
      - repack_ios
      - maestro_ios
      - get_build_android
      - build_android
      - repack_android
      - maestro_android
    # `workflow_dispatch` runs have no PR; the job would fail, not skip, without this guard.
    if: ${{ github.event_name == 'pull_request' }}
    params:
      # `payload` = fully custom markdown (it excludes `message` / `build_ids`; the auto mode
      # would render a builds table instead). No update-in-place option exists on the job, so
      # every run adds a comment. The `expo.dev/accounts/…/projects/…` prefix is the Expo
      # account + slug, not the GitHub owner — no context exposes it, so it is spelled out here
      # and `bun run init` (T7.1) rewrites it with the identifiers in app.config.ts.
      payload: |
        ## E2E (native) · `${{ substring(github.sha, 0, 7) }}`

        | Platform | Maestro | Build | Fingerprint |
        | --- | --- | --- | --- |
        | iOS (simulator) | ${{ after.maestro_ios.status == 'success' ? '✅ passed' : after.maestro_ios.status == 'failure' ? '❌ failed' : '⏭️ skipped' }} ${{ after.maestro_ios.outputs.total_flows_count ? '(' + after.maestro_ios.outputs.successful_flows_count + '/' + after.maestro_ios.outputs.total_flows_count + ' flows)' : '' }} | ${{ after.get_build_ios.outputs.build_id ? 'cached base + repack' : 'fresh build' }} — ${{ (after.repack_ios.outputs.build_id || after.build_ios.outputs.build_id) ? '[' + substring(after.repack_ios.outputs.build_id || after.build_ios.outputs.build_id || '', 0, 8) + '](https://expo.dev/accounts/seandillon1224/projects/expo-boilerplate/builds/' + (after.repack_ios.outputs.build_id || after.build_ios.outputs.build_id) + ')' : 'none (' + (after.get_build_ios.outputs.build_id ? after.repack_ios.status : after.build_ios.status) + ')' }} | `${{ substring(after.fingerprint.outputs.ios_fingerprint_hash || '', 0, 12) }}` |
        | Android (APK) | ${{ after.maestro_android.status == 'success' ? '✅ passed' : after.maestro_android.status == 'failure' ? '❌ failed' : '⏭️ skipped' }} ${{ after.maestro_android.outputs.total_flows_count ? '(' + after.maestro_android.outputs.successful_flows_count + '/' + after.maestro_android.outputs.total_flows_count + ' flows)' : '' }} | ${{ after.get_build_android.outputs.build_id ? 'cached base + repack' : 'fresh build' }} — ${{ (after.repack_android.outputs.build_id || after.build_android.outputs.build_id) ? '[' + substring(after.repack_android.outputs.build_id || after.build_android.outputs.build_id || '', 0, 8) + '](https://expo.dev/accounts/seandillon1224/projects/expo-boilerplate/builds/' + (after.repack_android.outputs.build_id || after.build_android.outputs.build_id) + ')' : 'none (' + (after.get_build_android.outputs.build_id ? after.repack_android.status : after.build_android.status) + ')' }} | `${{ substring(after.fingerprint.outputs.android_fingerprint_hash || '', 0, 12) }}` |

        ${{ after.maestro_ios.outputs.failed_flows_count > 0 ? '- iOS failed flows: `' + after.maestro_ios.outputs.failed_flow_names_json + '`' : '' }}
        ${{ after.maestro_android.outputs.failed_flows_count > 0 ? '- Android failed flows: `' + after.maestro_android.outputs.failed_flow_names_json + '`' : '' }}

        - **Install**: the Android build page hosts the install link + QR code (internal distribution). The iOS build is a simulator `.app` with no QR code: download it from its page or `bun run e2e:build --platform ios --build-id <id>`.
        - **Recordings / JUnit**: [workflow run](${{ workflow.url }}) → artifacts → **Maestro Test Results**.
        - **Reproduce locally**: `bun run e2e:build --platform <p> && bun run e2e:repack --platform <p> && bun run e2e:<p>` (docs/native-e2e.md).

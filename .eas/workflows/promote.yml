# UAT / production rung (PLAN.md 3, 10, 13): promote a staging update group — the exact bytes on
# `staging` — to `uat` or `production`, by hand, behind an expo.dev approval. resolve → approve →
# fingerprint + get_build (target variant) → gate (uat: build on a miss; production: refuse) →
# republish (staged rollout for production, ADR-0003) → web redeploy → Slack. Runbook, gate matrix,
# rollout ramp and critical updates: docs/release-ladder.md.
# Run:      bun run eas workflow:run .eas/workflows/promote.yml -F target=uat [-F update_group_id=<id>]
# Validate: bun run eas workflow:validate .eas/workflows/promote.yml   (cap: 16 KiB)
# Repo constants as in deploy-staging.yml: IOS_BUILDS → build_ios, HOSTING → promote_web_*. Custom
# jobs export EXPO_TOKEN from `${ eas.job.secrets.robotAccessToken }` (the run's own robot token).
# The resolve / gate / Slack logic lives in scripts/eas/ (docs/ci-overview.md → Where the job
# logic lives), which is why every custom job checks the repo out first.
name: Promote

on:
  workflow_dispatch:
    inputs:
      target:
        type: choice
        options: [uat, production]
        default: uat
        required: true
        description: Channel to promote to.
      update_group_id:
        type: string
        description: Update group to promote. Empty = the newest group on the `staging` branch.
      rollout_percentage:
        type: string
        default: '100'
        description: Integer 1–100 — share of production users served at once (ramp with eas update:edit). uat is always 100.
      critical:
        type: choice
        options: ['yes', 'no']
        default: 'no'
        description: yes = refuse unless the group was published critical (deploy-staging.yml critical=yes); republish cannot add it.
      web:
        type: choice
        options: [promote, skip]
        default: promote
        description: promote = redeploy the web export to the target alias (needs HOSTING).
      ios_builds:
        type: choice
        options: [enabled, disabled]
        default: disabled
        description: enabled = cut an iOS uat build on a fingerprint miss (needs ad hoc credentials).
      hosting:
        type: choice
        options: [enabled, disabled]
        default: disabled
        description: enabled = EAS Hosting is claimed; the web export can be deployed.

jobs:
  resolve:
    name: Resolve update group
    # Runs before the approval so the approver can read group / commit / runtime / policy here.
    outputs:
      group_id: ${{ steps.group.outputs.group_id }}
      ios_runtime: ${{ steps.group.outputs.ios_runtime }}
      android_runtime: ${{ steps.group.outputs.android_runtime }}
      commit: ${{ steps.group.outputs.commit }}
      message: ${{ steps.group.outputs.message }}
    steps:
      - uses: eas/checkout
      - uses: eas/install_node_modules
      - id: group
        name: Look up the group
        env:
          INPUT_GROUP: ${{ inputs.update_group_id || '' }}
          CRITICAL: ${{ inputs.critical || 'no' }}
        run: |
          export EXPO_TOKEN="${ eas.job.secrets.robotAccessToken }"
          node scripts/eas/promote-resolve.js --group "$INPUT_GROUP" --critical "$CRITICAL"
          while IFS=$'\t' read -r key value; do set-output "$key" "$value"; done < outputs.txt

  approve:
    name: Approve promotion
    type: require-approval
    # A project member approves / rejects on the run page; rejection fails every `needs` descendant.
    needs: [resolve]

  # --- Checkout fingerprint, target variant

  fingerprint_uat:
    name: Fingerprint (uat)
    type: fingerprint
    needs: [approve]
    if: ${{ inputs.target == 'uat' }}
    environment: preview
    env:
      APP_VARIANT: uat

  fingerprint_production:
    name: Fingerprint (production)
    type: fingerprint
    needs: [approve]
    if: ${{ inputs.target == 'production' }}
    environment: production
    env:
      APP_VARIANT: production

  # --- A target build that runs this group? Keyed by the GROUP's runtime, per platform.

  get_build_ios:
    name: Get build (ios)
    type: get-build
    needs: [approve, resolve]
    if: ${{ needs.resolve.outputs.ios_runtime }}
    params:
      platform: ios
      profile: ${{ inputs.target }}
      distribution: "${{ inputs.target == 'production' ? 'store' : 'internal' }}"
      fingerprint_hash: ${{ needs.resolve.outputs.ios_runtime }}
      wait_for_in_progress: true

  get_build_android:
    name: Get build (android)
    type: get-build
    needs: [approve, resolve]
    if: ${{ needs.resolve.outputs.android_runtime }}
    params:
      platform: android
      profile: ${{ inputs.target }}
      distribution: "${{ inputs.target == 'production' ? 'store' : 'internal' }}"
      fingerprint_hash: ${{ needs.resolve.outputs.android_runtime }}
      wait_for_in_progress: true

  gate:
    name: Fingerprint gate
    after: [resolve, fingerprint_uat, fingerprint_production, get_build_ios, get_build_android]
    if: ${{ after.resolve.status == 'success' && (after.fingerprint_uat.status == 'success' || after.fingerprint_production.status == 'success') }}
    outputs:
      build_ios: ${{ steps.decide.outputs.build_ios }}
      build_android: ${{ steps.decide.outputs.build_android }}
    env:
      TARGET: ${{ inputs.target }}
      GROUP: ${{ after.resolve.outputs.group_id }}
      COMMIT: ${{ after.resolve.outputs.commit }}
      IOS_RUNTIME: ${{ after.resolve.outputs.ios_runtime }}
      ANDROID_RUNTIME: ${{ after.resolve.outputs.android_runtime }}
      IOS_FP: ${{ after.fingerprint_uat.outputs.ios_fingerprint_hash || after.fingerprint_production.outputs.ios_fingerprint_hash }}
      ANDROID_FP: ${{ after.fingerprint_uat.outputs.android_fingerprint_hash || after.fingerprint_production.outputs.android_fingerprint_hash }}
      IOS_BUILD: ${{ after.get_build_ios.outputs.build_id }}
      ANDROID_BUILD: ${{ after.get_build_android.outputs.build_id }}
    steps:
      - uses: eas/checkout
      - id: decide
        name: Hit or miss, per platform
        # uat miss: build only when checkout fingerprint == group runtime; production miss: fail.
        # The outputs are set even on a refusal (the Slack post reads them), so the exit is deferred.
        run: |
          node scripts/eas/fingerprint-gate.js --mode "$TARGET" || refused=1
          while IFS=$'\t' read -r key value; do set-output "$key" "$value"; done < outputs.txt
          [ -z "${refused:-}" ] || exit 1

  # --- uat builds on a miss

  build_ios:
    name: Build (ios, uat)
    type: build
    needs: [gate, resolve]
    # IOS_BUILDS — ad hoc credentials for `uat` (docs/environments-and-secrets.md).
    if: ${{ needs.gate.outputs.build_ios == 'true' && (inputs.ios_builds || 'disabled') == 'enabled' }}
    params:
      platform: ios
      profile: uat
      message: uat build for update group ${{ needs.resolve.outputs.group_id }}

  build_android:
    name: Build (android, uat)
    type: build
    needs: [gate, resolve]
    if: ${{ needs.gate.outputs.build_android == 'true' }}
    params:
      platform: android
      profile: uat
      message: uat build for update group ${{ needs.resolve.outputs.group_id }}

  republish:
    name: Republish
    # `after` the builds: a failed uat build must not block the OTA (keyed by runtime, harmless for
    # a platform with no matching build — as in deploy-staging.yml). A failed gate does.
    after: [resolve, gate, build_ios, build_android]
    if: ${{ after.gate.status == 'success' }}
    outputs:
      group_id: ${{ steps.republish.outputs.group_id }}
    env:
      APP_VARIANT: ${{ inputs.target }}
      TARGET: ${{ inputs.target }}
      GROUP: ${{ after.resolve.outputs.group_id }}
      SOURCE_MESSAGE: ${{ after.resolve.outputs.message }}
      ROLLOUT: ${{ inputs.rollout_percentage || '100' }}
    steps:
      - uses: eas/checkout
      - uses: eas/install_node_modules
      - id: republish
        name: eas update:republish
        # `--group` is the only --non-interactive selector; the destination channel resolves the target
        # branch. Same assets and runtime, new group. Staged rollout (ADR-0003): production only.
        run: |
          export EXPO_TOKEN="${ eas.job.secrets.robotAccessToken }"
          [[ "$ROLLOUT" =~ ^[0-9]+$ ]] && [ "$ROLLOUT" -ge 1 ] && [ "$ROLLOUT" -le 100 ] || { echo "rollout_percentage must be an integer 1–100, got '$ROLLOUT'"; exit 1; }
          rollout=()
          if [ "$TARGET" = production ] && [ "$ROLLOUT" -lt 100 ]; then
            rollout=(--rollout-percentage "$ROLLOUT"); echo "rollout: $ROLLOUT% (ramp: eas update:edit <group> --rollout-percentage <n>)"
          elif [ "$ROLLOUT" -lt 100 ]; then echo "rollout: $ROLLOUT ignored — $TARGET always gets 100%"
          else echo "rollout: 100%"; fi
          bun run eas update:republish --group "$GROUP" --destination-channel "$TARGET" "${rollout[@]}" \
            --message "promote ${GROUP:0:8} (staging → $TARGET): $SOURCE_MESSAGE" --json --non-interactive > republished.json
          node -e 'const fs = require("node:fs"), r = JSON.parse(fs.readFileSync("republished.json", "utf8")); fs.writeFileSync("group.txt", (Array.isArray(r) ? r[0] : r)?.group ?? "")'
          echo "republished as group $(cat group.txt)"; set-output group_id "$(cat group.txt)"

  # --- Web: a fresh export of this checkout to the target alias (--ref <commit> for identical bytes).

  promote_web_uat:
    name: Deploy web (uat)
    type: deploy
    needs: [republish]
    if: ${{ inputs.target == 'uat' && (inputs.web || 'promote') == 'promote' && (inputs.hosting || 'disabled') == 'enabled' }}
    environment: preview
    env:
      APP_VARIANT: uat
    params:
      alias: uat
      prod: false

  promote_web_production:
    name: Deploy web (production)
    type: deploy
    needs: [republish]
    if: ${{ inputs.target == 'production' && (inputs.web || 'promote') == 'promote' && (inputs.hosting || 'disabled') == 'enabled' }}
    environment: production
    env:
      APP_VARIANT: production
    params:
      prod: true

  slack:
    name: Slack
    # As in deploy-staging.yml (`type: slack` cannot take an expression as webhook_url): compose →
    # guard → `eas/send_slack_message`. `after` on everything so the post goes out on a red run too;
    # the wording lives in scripts/eas/slack-compose.js, which reads this env block.
    # prettier-ignore
    after: [resolve, approve, gate, build_ios, build_android, republish, promote_web_uat, promote_web_production]
    environment: preview
    env:
      TARGET: ${{ inputs.target }}
      WORKFLOW_URL: ${{ workflow.url }}
      APPROVE_STATUS: ${{ after.approve.status }}
      GATE_STATUS: ${{ after.gate.status }}
      GATE_BUILD_IOS: ${{ after.gate.outputs.build_ios }}
      GROUP_ID: ${{ after.resolve.outputs.group_id }}
      GROUP_MESSAGE: ${{ after.resolve.outputs.message }}
      REPUBLISH_STATUS: ${{ after.republish.status }}
      REPUBLISH_GROUP_ID: ${{ after.republish.outputs.group_id }}
      BUILD_IOS_STATUS: ${{ after.build_ios.status }}
      BUILD_IOS_ID: ${{ after.build_ios.outputs.build_id }}
      BUILD_ANDROID_STATUS: ${{ after.build_android.status }}
      BUILD_ANDROID_ID: ${{ after.build_android.outputs.build_id }}
      WEB_UAT_STATUS: ${{ after.promote_web_uat.status }}
      WEB_UAT_URL: ${{ after.promote_web_uat.outputs.deploy_url }}
      WEB_PROD_STATUS: ${{ after.promote_web_production.status }}
      WEB_PROD_URL: ${{ after.promote_web_production.outputs.deploy_url }}
    steps:
      - uses: eas/checkout
      - id: compose
        name: Compose message
        run: set-output text "$(node scripts/eas/slack-compose.js promote)"
      - id: guard
        name: Skip without webhook
        run: |
          if [ -n "${SLACK_WEBHOOK_URL:-}" ]; then set-output has_slack true
          else echo "SLACK_WEBHOOK_URL is not set in the preview environment — skipping (docs/release-ladder.md → Enable)."; set-output has_slack false; fi
      - uses: eas/send_slack_message
        if: ${{ steps.guard.outputs.has_slack == 'true' }}
        with:
          message: ${{ steps.compose.outputs.text }}
          slack_hook_url: ${{ env.SLACK_WEBHOOK_URL }}

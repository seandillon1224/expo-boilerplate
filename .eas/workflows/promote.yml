# UAT / production rung (PLAN.md 3, 10, 13): promote a staging update group — the exact bytes on
# `staging` — to `uat` or `production`, by hand, behind an expo.dev approval. resolve → approve →
# fingerprint + get_build (target variant) → gate (uat: build on a miss; production: refuse) →
# republish (staged rollout for production, ADR-0003) → web redeploy → Slack. Runbook, gate matrix,
# rollout ramp and critical updates: docs/release-ladder.md.
# Run:      bun run eas workflow:run .eas/workflows/promote.yml -F target=uat [-F update_group_id=<id>]
# Validate: bun run eas workflow:validate .eas/workflows/promote.yml   (cap: 16 KiB — near it, trim comments)
# Repo constants as in deploy-staging.yml: IOS_BUILDS → build_ios, HOSTING → promote_web_*. Custom
# jobs export EXPO_TOKEN from `${ eas.job.secrets.robotAccessToken }` (the run's own robot token).
name: Promote

on:
  workflow_dispatch:
    inputs:
      target:
        type: choice
        options: [uat, production]
        default: uat
        required: true
        description: Channel to promote to.
      update_group_id:
        type: string
        description: Update group to promote. Empty = the newest group on the `staging` branch.
      rollout_percentage:
        type: string
        default: '100'
        description: Integer 1–100 — share of production users served at once (ramp with eas update:edit). uat is always 100.
      critical:
        type: choice
        options: ['yes', 'no']
        default: 'no'
        description: yes = refuse unless the group was published critical (deploy-staging.yml critical=yes); republish cannot add it.
      web:
        type: choice
        options: [promote, skip]
        default: promote
        description: promote = redeploy the web export to the target alias (needs HOSTING).
      ios_builds:
        type: choice
        options: [enabled, disabled]
        default: disabled
        description: enabled = cut an iOS uat build on a fingerprint miss (needs ad hoc credentials).
      hosting:
        type: choice
        options: [enabled, disabled]
        default: disabled
        description: enabled = EAS Hosting is claimed; the web export can be deployed.

jobs:
  resolve:
    name: Resolve update group
    # Runs before the approval so the approver can read group / commit / runtime / policy here.
    outputs:
      group_id: ${{ steps.group.outputs.group_id }}
      ios_runtime: ${{ steps.group.outputs.ios_runtime }}
      android_runtime: ${{ steps.group.outputs.android_runtime }}
      commit: ${{ steps.group.outputs.commit }}
      message: ${{ steps.group.outputs.message }}
    steps:
      - uses: eas/checkout
      - uses: eas/install_node_modules
      - id: group
        name: Look up the group
        env:
          INPUT_GROUP: ${{ inputs.update_group_id || '' }}
          CRITICAL: ${{ inputs.critical || 'no' }}
        run: |
          export EXPO_TOKEN="${ eas.job.secrets.robotAccessToken }"
          cat > resolve.js <<'__JS__'
          const { execFileSync } = require('node:child_process');
          const eas = (...args) => JSON.parse(execFileSync('bun', ['run', 'eas', ...args, '--json', '--non-interactive'], { encoding: 'utf8', stdio: ['ignore', 'pipe', 'inherit'] }));
          let group = (process.env.INPUT_GROUP || '').trim();
          if (!group) {
            group = eas('update:list', '--branch', 'staging', '--limit', '1').currentPage?.[0]?.group ?? '';
            if (!group) { console.error('No update group on `staging` yet (deploy-staging.yml).'); process.exit(1); }
          }
          const updates = eas('update:view', group);
          if (!Array.isArray(updates) || updates.length === 0) { console.error(`Update group ${group} not found.`); process.exit(1); }
          if (updates[0].branch !== 'staging') { console.error(`Update group ${group} is on branch "${updates[0].branch}", not staging — promote only what staging has run.`); process.exit(1); }
          const rt = (p) => updates.find((u) => u.platform === p)?.runtimeVersion ?? '';
          const out = { group_id: group, ios_runtime: rt('ios'), android_runtime: rt('android'), commit: updates[0].gitCommitHash ?? '', message: (updates[0].message ?? '').slice(0, 120) };
          console.log(JSON.stringify(out, null, 2));
          require('node:fs').writeFileSync('outputs.txt', Object.entries(out).map(([k, v]) => `${k}\t${v}`).join('\n'));
          // Critical (ADR-0003) lives in the manifest, which a republish carries unchanged: critical=yes
          // verifies the flag is there; it can never add it.
          (async () => {
            const read = (u) => fetch(u.manifestPermalink, { headers: { accept: 'application/json' } }).then((r) => r.json()).then((m) => m?.extra?.expoClient?.extra?.updatePolicy ?? 'silent', (e) => `unreadable: ${e.message}`);
            const policies = await Promise.all(updates.map(async (u) => `${u.platform}=${await read(u)}`));
            const critical = policies.every((p) => p.endsWith('=forced'));
            console.log(`updatePolicy ${policies.join(' ')} → ${critical ? 'CRITICAL' : 'not critical'}`);
            if (process.env.CRITICAL === 'yes' && !critical) { console.error(`critical=yes but group ${group} is not critical — publish to staging with critical=yes and promote that group.`); process.exit(1); }
          })();
          __JS__
          node resolve.js
          while IFS=$'\t' read -r key value; do set-output "$key" "$value"; done < outputs.txt

  approve:
    name: Approve promotion
    type: require-approval
    # A project member approves / rejects on the run page; rejection fails every `needs` descendant.
    needs: [resolve]

  # --- Checkout fingerprint, target variant

  fingerprint_uat:
    name: Fingerprint (uat)
    type: fingerprint
    needs: [approve]
    if: ${{ inputs.target == 'uat' }}
    environment: preview
    env:
      APP_VARIANT: uat

  fingerprint_production:
    name: Fingerprint (production)
    type: fingerprint
    needs: [approve]
    if: ${{ inputs.target == 'production' }}
    environment: production
    env:
      APP_VARIANT: production

  # --- A target build that runs this group? Keyed by the GROUP's runtime, per platform.

  get_build_ios:
    name: Get build (ios)
    type: get-build
    needs: [approve, resolve]
    if: ${{ needs.resolve.outputs.ios_runtime }}
    params:
      platform: ios
      profile: ${{ inputs.target }}
      distribution: "${{ inputs.target == 'production' ? 'store' : 'internal' }}"
      fingerprint_hash: ${{ needs.resolve.outputs.ios_runtime }}
      wait_for_in_progress: true

  get_build_android:
    name: Get build (android)
    type: get-build
    needs: [approve, resolve]
    if: ${{ needs.resolve.outputs.android_runtime }}
    params:
      platform: android
      profile: ${{ inputs.target }}
      distribution: "${{ inputs.target == 'production' ? 'store' : 'internal' }}"
      fingerprint_hash: ${{ needs.resolve.outputs.android_runtime }}
      wait_for_in_progress: true

  gate:
    name: Fingerprint gate
    after: [resolve, fingerprint_uat, fingerprint_production, get_build_ios, get_build_android]
    if: ${{ after.resolve.status == 'success' && (after.fingerprint_uat.status == 'success' || after.fingerprint_production.status == 'success') }}
    outputs:
      build_ios: ${{ steps.decide.outputs.build_ios }}
      build_android: ${{ steps.decide.outputs.build_android }}
    env:
      TARGET: ${{ inputs.target }}
      GROUP: ${{ after.resolve.outputs.group_id }}
      COMMIT: ${{ after.resolve.outputs.commit }}
      IOS_RUNTIME: ${{ after.resolve.outputs.ios_runtime }}
      ANDROID_RUNTIME: ${{ after.resolve.outputs.android_runtime }}
      IOS_FP: ${{ after.fingerprint_uat.outputs.ios_fingerprint_hash || after.fingerprint_production.outputs.ios_fingerprint_hash }}
      ANDROID_FP: ${{ after.fingerprint_uat.outputs.android_fingerprint_hash || after.fingerprint_production.outputs.android_fingerprint_hash }}
      IOS_BUILD: ${{ after.get_build_ios.outputs.build_id }}
      ANDROID_BUILD: ${{ after.get_build_android.outputs.build_id }}
    steps:
      - id: decide
        name: Hit or miss, per platform
        # uat miss: build only when checkout fingerprint == group runtime; production miss: fail.
        run: |
          fail=0
          decide() {
            p="$1"; runtime="$2"; fp="$3"; build="$4"; verdict=false
            if [ -z "$runtime" ]; then echo "$p: not in the group — skipped"; set-output "build_$p" false; return; fi
            if [ -n "$build" ]; then echo "$p: HIT — $TARGET build $build runs $runtime"
            elif [ "$TARGET" = "production" ]; then
              echo "$p: MISS — no production store build runs runtime $runtime (checkout: $fp). Tag a release (release.yml), then promote again."; fail=1
            elif [ "$fp" = "$runtime" ]; then echo "$p: MISS — cutting a uat build from this checkout ($fp)"; verdict=true
            else
              echo "$p: MISS — checkout fingerprint $fp != group runtime $runtime; re-run from the group's commit:"
              echo "  bun run eas workflow:run .eas/workflows/promote.yml --ref ${COMMIT:-<commit>} -F target=uat -F update_group_id=$GROUP"; fail=1
            fi
            set-output "build_$p" "$verdict"
          }
          decide ios "$IOS_RUNTIME" "$IOS_FP" "$IOS_BUILD"
          decide android "$ANDROID_RUNTIME" "$ANDROID_FP" "$ANDROID_BUILD"
          [ "$fail" = 0 ] || { echo "Fingerprint gate: refusing $GROUP → $TARGET."; exit 1; }

  # --- uat builds on a miss

  build_ios:
    name: Build (ios, uat)
    type: build
    needs: [gate, resolve]
    # IOS_BUILDS — ad hoc credentials for `uat` (docs/environments-and-secrets.md).
    if: ${{ needs.gate.outputs.build_ios == 'true' && (inputs.ios_builds || 'disabled') == 'enabled' }}
    params:
      platform: ios
      profile: uat
      message: uat build for update group ${{ needs.resolve.outputs.group_id }}

  build_android:
    name: Build (android, uat)
    type: build
    needs: [gate, resolve]
    if: ${{ needs.gate.outputs.build_android == 'true' }}
    params:
      platform: android
      profile: uat
      message: uat build for update group ${{ needs.resolve.outputs.group_id }}

  republish:
    name: Republish
    # `after` the builds: a failed uat build must not block the OTA (keyed by runtime, harmless for
    # a platform with no matching build — as in deploy-staging.yml). A failed gate does.
    after: [resolve, gate, build_ios, build_android]
    if: ${{ after.gate.status == 'success' }}
    outputs:
      group_id: ${{ steps.republish.outputs.group_id }}
    env:
      APP_VARIANT: ${{ inputs.target }}
      TARGET: ${{ inputs.target }}
      GROUP: ${{ after.resolve.outputs.group_id }}
      SOURCE_MESSAGE: ${{ after.resolve.outputs.message }}
      ROLLOUT: ${{ inputs.rollout_percentage || '100' }}
    steps:
      - uses: eas/checkout
      - uses: eas/install_node_modules
      - id: republish
        name: eas update:republish
        # `--group` is the only --non-interactive selector; the destination channel resolves the target
        # branch. Same assets and runtime, new group. Staged rollout (ADR-0003): production only.
        run: |
          export EXPO_TOKEN="${ eas.job.secrets.robotAccessToken }"
          [[ "$ROLLOUT" =~ ^[0-9]+$ ]] && [ "$ROLLOUT" -ge 1 ] && [ "$ROLLOUT" -le 100 ] || { echo "rollout_percentage must be an integer 1–100, got '$ROLLOUT'"; exit 1; }
          rollout=()
          if [ "$TARGET" = production ] && [ "$ROLLOUT" -lt 100 ]; then
            rollout=(--rollout-percentage "$ROLLOUT"); echo "rollout: $ROLLOUT% (ramp: eas update:edit <group> --rollout-percentage <n>)"
          elif [ "$ROLLOUT" -lt 100 ]; then echo "rollout: $ROLLOUT ignored — $TARGET always gets 100%"
          else echo "rollout: 100%"; fi
          bun run eas update:republish --group "$GROUP" --destination-channel "$TARGET" "${rollout[@]}" \
            --message "promote ${GROUP:0:8} (staging → $TARGET): $SOURCE_MESSAGE" --json --non-interactive > republished.json
          node -e 'const fs = require("node:fs"), r = JSON.parse(fs.readFileSync("republished.json", "utf8")); fs.writeFileSync("group.txt", (Array.isArray(r) ? r[0] : r)?.group ?? "")'
          echo "republished as group $(cat group.txt)"; set-output group_id "$(cat group.txt)"

  # --- Web: a fresh export of this checkout to the target alias (--ref <commit> for identical bytes).

  promote_web_uat:
    name: Deploy web (uat)
    type: deploy
    needs: [republish]
    if: ${{ inputs.target == 'uat' && (inputs.web || 'promote') == 'promote' && (inputs.hosting || 'disabled') == 'enabled' }}
    environment: preview
    env:
      APP_VARIANT: uat
    params:
      alias: uat
      prod: false

  promote_web_production:
    name: Deploy web (production)
    type: deploy
    needs: [republish]
    if: ${{ inputs.target == 'production' && (inputs.web || 'promote') == 'promote' && (inputs.hosting || 'disabled') == 'enabled' }}
    environment: production
    env:
      APP_VARIANT: production
    params:
      prod: true

  slack:
    name: Slack
    # As in deploy-staging.yml (`type: slack` cannot take an expression as webhook_url).
    # prettier-ignore
    after: [resolve, approve, gate, build_ios, build_android, republish, promote_web_uat, promote_web_production]
    environment: preview
    steps:
      - name: Compose message
        run: |
          cat > slack.txt <<'__SLACK_MSG__'
          *Promote → ${{ inputs.target }}* · ${{ after.republish.status == 'success' ? '✅ promoted' : after.approve.status == 'failure' ? '🚫 rejected' : after.gate.status == 'failure' ? '⛔ gate refused' : after.republish.status == 'failure' ? '❌ republish failed' : '⏭️ nothing published' }} · group `${{ substring(after.resolve.outputs.group_id || '', 0, 8) }}` ${{ after.resolve.outputs.message ? '— ' + after.resolve.outputs.message : '' }}
          ${{ (after.build_ios.status == 'success' || after.build_android.status == 'success') ? ':warning: *Reinstall required* — new uat builds cut; installed uat apps will not get this update.' : after.republish.status == 'success' ? 'Installed ' + inputs.target + ' apps pick it up on next launch.' : 'See the run log.' }}
          • *Update*: ${{ after.republish.outputs.group_id ? '<@P@/updates/' + after.republish.outputs.group_id + '|' + substring(after.republish.outputs.group_id || '', 0, 8) + '> on `' + inputs.target + '`' : 'none' }} · <${{ workflow.url }}|workflow run>
          • *iOS*: ${{ after.build_ios.outputs.build_id ? '<@P@/builds/' + after.build_ios.outputs.build_id + '|new uat build>' : after.build_ios.status == 'failure' ? '❌ build failed (credentials?)' : after.gate.outputs.build_ios == 'true' ? '⏭️ IOS_BUILDS disabled' : 'existing build' }}
          • *Android*: ${{ after.build_android.outputs.build_id ? '<@P@/builds/' + after.build_android.outputs.build_id + '|new uat build>' : after.build_android.status == 'failure' ? '❌ build failed' : 'existing build' }}
          • *Web*: ${{ after.promote_web_uat.outputs.deploy_url || after.promote_web_production.outputs.deploy_url ? '<' + (after.promote_web_uat.outputs.deploy_url || after.promote_web_production.outputs.deploy_url) + '>' : (after.promote_web_uat.status == 'failure' || after.promote_web_production.status == 'failure') ? '❌ deploy failed' : '⏭️ skipped' }}
          __SLACK_MSG__
          sed -i "s#@P@#https://expo.dev/accounts/seandillon1224/projects/expo-boilerplate#g" slack.txt
      - name: Post to Slack
        run: |
          [ -n "${SLACK_WEBHOOK_URL:-}" ] || { echo "SLACK_WEBHOOK_URL is not set (preview environment) — skipping."; exit 0; }
          node -e 'fetch(process.env.SLACK_WEBHOOK_URL, { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ text: require("node:fs").readFileSync("slack.txt", "utf8").trim() }) }).then((r) => r.ok ? console.log("posted") : Promise.reject(new Error("Slack " + r.status))).catch((e) => { console.error(e.message); process.exit(1); })'
